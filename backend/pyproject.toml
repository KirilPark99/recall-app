[project]
name = "recall-backend"
version = "1.0.0"
description = "Recall — self-hosted card study service (backend API)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30,<2.1",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3",
  "argon2-cffi>=23",
  "fsrs>=6,<7",
  "python-multipart>=0.0.9",
  "pillow>=10.3",
  "httpx>=0.27,<1",
  "edge-tts>=7,<8",
  "nodriver>=0.50,<0.51",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "selenium>=4.20",
  "webdriver-manager>=4,<5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["app/tests"]
